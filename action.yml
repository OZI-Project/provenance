name: 'OZI Provenance'
description: 'Generate provenance attestations for OZI build artifacts'
author: 'OZI Project'
branding:
  color: 'blue'
  icon: 'lock'
inputs:
  release-tag:
    description: release tag to upload provenance to
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
    - id: attest
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # 4.1.0
      with:
        subject-path: 'artifact/dist/*'
    - run: gh release upload "$RELEASE_TAG" "$BUNDLE_PATH"
      env:
        BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        GITHUB_TOKEN: ${{ github.token }}
      shell: bash
